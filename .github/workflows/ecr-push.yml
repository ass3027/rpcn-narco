name: Push Docker image to Amazon ECR

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run Rust tests
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production Compose file
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes compose.prod.yml \
            "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/compose.prod.yml"

      - name: Pull and run production image
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.ref_name }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "cd '$PROD_DEPLOY_PATH' && \
             test -f .env && \
             RPCN_DATA_PATH=\$(sed -n 's/^RPCN_DATA_PATH=//p' .env) && \
             test -n \"\$RPCN_DATA_PATH\" && \
             test -f \"\$RPCN_DATA_PATH/rpcn.cfg\" && \
             test -f \"\$RPCN_DATA_PATH/servers.cfg\" && \
             test -f \"\$RPCN_DATA_PATH/server_redirs.cfg\" && \
             test -f \"\$RPCN_DATA_PATH/scoreboards.cfg\" && \
             test -f \"\$RPCN_DATA_PATH/domains_whitelist.txt\" && \
             if grep -q '^IMAGE_TAG=' .env; then \
               sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env; \
             else \
               printf '\\nIMAGE_TAG=%s\\n' '$IMAGE_TAG' >> .env; \
             fi && \
             ECR_REGISTRY=\$(sed -n 's/^ECR_REGISTRY=//p' .env) && \
             aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin \"\$ECR_REGISTRY\" && \
             docker compose --env-file .env -f compose.prod.yml pull && \
             docker compose --env-file .env -f compose.prod.yml up -d --remove-orphans"
